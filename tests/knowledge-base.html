<!doctype html><html lang="nb"><meta charset="utf-8"><title>Kunnskapsbase – regresjonstester</title>
<h1>Kunnskapsbase – regresjonstester</h1><p id="summary">Kjører …</p><pre id="results"></pre>
<script type="module">
import { generateKnowledgeBaseForSubject } from '../src/services/concepts/knowledgeBaseService.ts';
const assert=(value,message)=>{if(!value)throw new Error(message)};
const topic={id:'topic',subject_id:'subject',name:'Tema',sort_order:0};
const subtopic={id:'subtopic',topic_id:'topic',name:'Undertema',sort_order:0,topics:topic};
const note=id=>({id,subject_id:'subject',title:id,description:'',slug:id,content:'<p>Et fagbegrep</p>',content_json:null,subtopics:subtopic,subtopic_id:subtopic.id,folder_id:null,created_at:''});
const existing={id:'concept',name:'Begrep',slug:'begrep',type:'definition',short_definition:'Manuell definisjon',explanation:'Manuell forklaring'};
const candidate={name:'Begrep',type:'definition',shortDefinition:'AI-definisjon',explanation:'AI-forklaring',subtopicIds:['subtopic']};
const response=(data,status=200)=>new Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json'}});
const originalFetch=window.fetch;
async function scenario({failAI=false,failStatus=500,invalidNote=false,allInvalid=false,emptyNote=false,failSave=false,namedCallout=false,alreadyLinked=false,options={}}={}){
 const calls=[];let extractionCount=0;let links=[];
 window.fetch=async(input,init={})=>{
  const url=new URL(typeof input==='string'?input:input.url);const method=init.method??'GET';
  calls.push({path:url.pathname,method});
  if(url.pathname.endsWith('/api/concepts/extract/')){
   extractionCount++;
   if(allInvalid || (invalidNote && extractionCount===2))return response({error:'Ugyldig svar etter to forsøk',code:'invalid_ai_response'},502);
   return failAI&&extractionCount===2?response({error:'Testfeil'},failStatus):response({candidates:namedCallout?[]:[candidate]});
  }
  const table=url.pathname.split('/').at(-1);
  if(method==='GET'){
   if(table==='topics')return response([topic]);
   if(table==='subtopics')return response([subtopic]);
   if(table==='notes')return response((invalidNote?['one','two','three']:['one','two']).map(id=>{
    const row=note(id);
    if(emptyNote&&id==='one')row.content='';
    if(namedCallout){
      row.content='<div data-type="callout" data-callout-type="definition" data-concept-name="Begrep"'+(alreadyLinked?' data-concept-id="manual"':'')+'><div class="note-callout-body"><p>En forklaring</p></div></div>';
      row.content_json={type:'doc',content:[{type:'callout',attrs:{type:'definition',conceptName:'Begrep',conceptId:alreadyLinked?'manual':null},content:[{type:'paragraph',content:[{type:'text',text:'En forklaring'}]}]}]};
    }
    return row;
   }));
   if(table==='concepts')return response([existing]);
   if(table==='concept_subtopics')return response(links);
  }
  if(table==='notes'&&method==='PATCH')return response([{id:'one'}]);
  if(table==='concept_subtopics'&&method==='POST'){
   if(failSave)return response({message:'Testfeil ved lagring'},400);
   links=[{concept_id:'concept',subtopic_id:'subtopic'}];return response(null,201);
  }
  throw new Error('Uventet forespørsel i testen: '+method+' '+url.pathname);
 };
 let result,error;
 try{result=await generateKnowledgeBaseForSubject('subject','Testfag',options)}catch(e){error=e}
 finally{window.fetch=originalFetch}
 return {calls,result,error,extractionCount};
}
const writes=calls=>calls.filter(c=>c.path.includes('/rest/v1/')&&c.method!=='GET');
const tests=[
 ['Andre 502/503-feil stoppes uten å feilmerkes som ugyldige notater',async()=>{
  for(const status of [502,503]){
   const s=await scenario({failAI:true,failStatus:status});
   assert(s.error,'Tjenestefeil ble skjult');assert(writes(s.calls).length===0,'Tjenestefeil ga skriving');
  }
 }],
 ['Ett ugyldig notat hoppes over med tydelig rapport',async()=>{
  const s=await scenario({invalidNote:true});assert(!s.error,s.error?.message);
  assert(s.result.processedNotes===2&&s.result.skippedNotes===1,'Feil antall');
  assert(s.result.failedNotes.length===1&&s.result.failedNotes[0].id==='two'&&s.result.failedNotes[0].title==='two','Manglende notatidentifikasjon');
  const firstWrite=s.calls.findIndex(c=>c.path.includes('/rest/v1/')&&c.method!=='GET');
  assert(s.calls.slice(0,firstWrite).filter(c=>c.path.endsWith('/extract/')).length===3,'Lagring startet før analysen var ferdig');
  assert(writes(s.calls).every(c=>c.method==='POST'&&c.path.endsWith('/concept_subtopics')),'Eksisterende data ble endret');
 }],
 ['Alle ugyldige svar gir null behandlede notater og ingen lagring',async()=>{
  const s=await scenario({allInvalid:true,namedCallout:true});assert(!s.error,s.error?.message);
  assert(s.result.processedNotes===0&&s.result.skippedNotes===2&&s.result.failedNotes.length===2,'Feil total');
  assert(writes(s.calls).length===0,'Ugyldig notat ble delvis lagret via callout');
 }],
 ['Notater uten innhold skilles fra feilende AI-svar',async()=>{
  const s=await scenario({emptyNote:true});assert(!s.error,s.error?.message);
  assert(s.result.processedNotes===1&&s.result.skippedNotes===1&&s.result.failedNotes.length===0,'Feil kategorisering');
 }],
 ['Navngitt boks kobles selv når AI utelater begrepet',async()=>{
  const s=await scenario({namedCallout:true,options:{noteId:'one'}});assert(!s.error,s.error?.message);assert(s.result.linkedCallouts===1,'Navngitt boks ble ikke koblet');
 }],
 ['Manuelt koblet boks får ikke et nytt erstatningsbegrep',async()=>{
  const s=await scenario({namedCallout:true,alreadyLinked:true,options:{noteId:'one'}});assert(!s.error,s.error?.message);assert(s.result.conceptsProcessed===0&&writes(s.calls).length===0,'Manuell kobling ble erstattet');
 }],
 ['AI-feil på andre notat gir ingen databaseskriving',async()=>{
  const s=await scenario({failAI:true});assert(s.error,'Forventet AI-feil');assert(s.extractionCount===2,'Begge notater må analyseres');assert(writes(s.calls).length===0,'Databasen ble endret før analysen var ferdig');
 }],
 ['Fullført generering bevarer eksisterende begreper og koblinger',async()=>{
  const s=await scenario();assert(!s.error,s.error?.message);assert(s.result.processedNotes===2,'Feil antall notater');assert(writes(s.calls).every(c=>c.path.endsWith('/concept_subtopics')&&c.method==='POST'),'Eksisterende innhold ble endret');
  assert(writes(s.calls).length===1,'Eksisterende kobling ble lagt til flere ganger');
 }],
 ['Lagringsfeil utløser ingen sletting',async()=>{
  const s=await scenario({failSave:true});assert(s.error,'Forventet lagringsfeil');assert(!s.calls.some(c=>c.method==='DELETE'),'Slettet eksisterende koblinger');
 }],
 ['Avgrensing analyserer bare valgt notat',async()=>{
  const s=await scenario({options:{noteId:'two'}});assert(!s.error,s.error?.message);assert(s.extractionCount===1&&s.result.processedNotes===1,'Feil avgrensing');
 }],
 ['Ukjent notat avvises uten skriving',async()=>{
  const s=await scenario({options:{noteId:'missing'}});assert(s.error,'Forventet feil');assert(s.extractionCount===0&&writes(s.calls).length===0,'Ukjent notat utløste endringer');
 }],
];
let passed=0;
for(const [name,test]of tests){try{await test();passed++;document.querySelector('#results').textContent+='BESTÅTT: '+name+'\n'}catch(e){document.querySelector('#results').textContent+='FEIL: '+name+': '+e.message+'\n'}}
document.querySelector('#summary').textContent=`${passed}/${tests.length} bestått`;
</script></html>
